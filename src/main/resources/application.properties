spring.application.name=RotaSecaSOA
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/rotaseca?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:fiap}
spring.jpa.open-in-view=false

api.security.token.secret=${JWT_SECRET:12345678}
api.security.token.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:30}

# Proteção contra abuso
rotaseca.limite.login-tentativas=5
rotaseca.limite.login-bloqueio-minutos=15
rotaseca.limite.reportes-por-minuto=30
# Vazio = reportes de sensor/parceiro sem chave. Definida = exigem o header X-Api-Key.
rotaseca.reportes.chave-api=${REPORTES_CHAVE_API:}

# Job de coleta de chuva (Open-Meteo) a cada 15 minutos
rotaseca.chuva.job.habilitado=${CHUVA_JOB:true}
rotaseca.chuva.job.intervalo-ms=900000
