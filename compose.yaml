services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: fiap
      MYSQL_DATABASE: rotaseca
    ports: ["3306:3306"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: mysqladmin ping -uroot -pfiap --silent
      interval: 3s
      retries: 30

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rotaseca
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
